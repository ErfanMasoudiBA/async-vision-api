version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
